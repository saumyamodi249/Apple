<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - MyApple</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">
                <i class="bi bi-apple"></i> MyApple
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="categories.html">Products</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="about.html">About</a>
                    </li>
                    <li class="nav-item" id="navAuth">
                        <a class="nav-link" href="login.html">Login</a>
                    </li>
                    <li class="nav-item" id="navAuthSignup">
                        <a class="nav-link btn btn-primary text-white ms-2" href="signup.html">Sign Up</a>
                    </li>
                    <li class="nav-item dropdown" id="navProfile" style="display: none;">
                        <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="bi bi-person-circle"></i> <span id="profileNameSpan">Profile</span>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item" href="profile.html"><i class="bi bi-person"></i> Profile</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item text-danger" href="#" id="navLogout"><i class="bi bi-box-arrow-right"></i> Logout</a></li>
                        </ul>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="payment.html">
                            <i class="bi bi-cart3"></i> Cart <span class="badge bg-danger" id="cartCount">0</span>
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Profile Section -->
    <section class="py-5 mt-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-8 col-lg-6">
                    <div class="card shadow">
                        <div class="card-header bg-primary text-white">
                            <h5 class="mb-0"><i class="bi bi-person-circle"></i> Profile</h5>
                        </div>
                        <div class="card-body">
                            <div id="profileLoginRequired" class="text-center py-4" style="display: none;">
                                <p class="text-muted">You must be logged in to view your profile.</p>
                                <a href="login.html" class="btn btn-primary">Login</a>
                                <a href="signup.html" class="btn btn-outline-primary ms-2">Sign Up</a>
                            </div>
                            <form id="profileForm" style="display: none;">
                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label for="profileFirstName" class="form-label">First Name</label>
                                        <input type="text" class="form-control" id="profileFirstName" required>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label for="profileLastName" class="form-label">Last Name</label>
                                        <input type="text" class="form-control" id="profileLastName" required>
                                    </div>
                                </div>
                                <div class="mb-3">
                                    <label for="profileEmail" class="form-label">Email</label>
                                    <input type="email" class="form-control" id="profileEmail" readonly>
                                </div>
                                <div class="mb-3">
                                    <label for="profilePhone" class="form-label">Phone Number (10 digits, start with 6–9)</label>
                                    <input type="tel" class="form-control" id="profilePhone" maxlength="10" pattern="[6-9][0-9]{9}" required>
                                    <div class="invalid-feedback" id="profilePhoneFeedback"></div>
                                </div>
                                <div class="mb-3">
                                    <label for="profileGender" class="form-label">Gender</label>
                                    <select class="form-select" id="profileGender">
                                        <option value="">Select</option>
                                        <option value="Male">Male</option>
                                        <option value="Female">Female</option>
                                        <option value="Other">Other</option>
                                    </select>
                                </div>
                                <div class="mb-3">
                                    <label for="profileAddress" class="form-label">Address</label>
                                    <textarea class="form-control" id="profileAddress" rows="3"></textarea>
                                </div>
                                <button type="submit" class="btn btn-primary">
                                    <i class="bi bi-check2"></i> Save Profile
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
    <script>
    document.addEventListener('DOMContentLoaded', function() {
        const user = getLoggedInUser();
        const profileLoginRequired = document.getElementById('profileLoginRequired');
        const profileForm = document.getElementById('profileForm');
        if (!user) {
            if (profileLoginRequired) profileLoginRequired.style.display = 'block';
            if (profileForm) profileForm.style.display = 'none';
            return;
        }
        if (profileLoginRequired) profileLoginRequired.style.display = 'none';
        if (profileForm) profileForm.style.display = 'block';
        document.getElementById('profileFirstName').value = user.firstName || '';
        document.getElementById('profileLastName').value = user.lastName || '';
        document.getElementById('profileEmail').value = user.email || '';
        document.getElementById('profilePhone').value = user.phone || '';
        document.getElementById('profileGender').value = user.gender || '';
        document.getElementById('profileAddress').value = user.address || '';

        profileForm.addEventListener('submit', function(e) {
            e.preventDefault();
            const phone = (document.getElementById('profilePhone').value || '').replace(/\D/g, '');
            if (!/^[6-9]\d{9}$/.test(phone)) {
                document.getElementById('profilePhone').classList.add('is-invalid');
                document.getElementById('profilePhoneFeedback').textContent = 'Phone must be 10 digits and start with 6, 7, 8 or 9';
                return;
            }
            document.getElementById('profilePhone').classList.remove('is-invalid');
            const users = getUsers();
            const idx = users.findIndex(u => u.email && u.email.toLowerCase() === user.email.toLowerCase());
            if (idx === -1) return;
            users[idx] = {
                ...users[idx],
                firstName: document.getElementById('profileFirstName').value.trim(),
                lastName: document.getElementById('profileLastName').value.trim(),
                phone: phone,
                gender: document.getElementById('profileGender').value || '',
                address: document.getElementById('profileAddress').value.trim()
            };
            saveUsers(users);
            setLoggedInUser(users[idx]);
            showNotification('Profile saved successfully.');
        });
    });
    </script>
</body>
</html>
